name: Publish LocalWave v0.13.4

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.13.4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact signed candidate
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprwestus3.oaiusercontent.com/files/00000000-4b3c-81fd-a81d-c8ec1674666f/raw?se=2026-08-21T23%3A51%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=c694a1ae-3e96-5ddf-ac72-d75c2b1e4c88&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T21%3A08%3A16Z&ske=2026-08-22T21%3A08%3A16Z&sks=b&skv=2026-02-06&sig=%2BN0fIvFxMIvHws9aG1dZiMFGMtdO5et0bhS%2BK%2B2Nlq4%3D'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/candidate.zip
          rm -rf /tmp/candidate && mkdir /tmp/candidate
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          apk="$(find /tmp/candidate -maxdepth 2 -type f -name '*.apk' | head -1)"
          test -n "$apk"
          test "$(stat -c %s "$apk")" = '2888933'
          printf '%s  %s\n' '980a150a4381fddabb7eda2940e494e2716f62639e6e9e833d5319cd23edadfd' "$apk" | sha256sum -c -
          mkdir -p releases/v0.13.4
          cp "$apk" releases/v0.13.4/LocalWave-v0.13.4-release-signed.apk
          printf '%s  %s\n' '980a150a4381fddabb7eda2940e494e2716f62639e6e9e833d5319cd23edadfd' 'LocalWave-v0.13.4-release-signed.apk' > releases/v0.13.4/LocalWave-v0.13.4-release-signed.apk.sha256
          cat > releases/v0.13.4/README.md <<'EOF'
          # LocalWave v0.13.4

          Signed Android release for versionCode 38.

          Startup-only Whole House stream gating gives each Samsung/DLNA renderer a controlled prebuffer window before its latency-staggered Play command, while v0.13.3 stable clock filtering remains the fallback.
          EOF
      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add releases/v0.13.4
          git commit -m 'Publish LocalWave v0.13.4 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 38,
            "versionName": "0.13.4",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.4/LocalWave-v0.13.4-release-signed.apk",
            "sha256": "980a150a4381fddabb7eda2940e494e2716f62639e6e9e833d5319cd23edadfd",
            "releaseNotes": "Stream-gated Whole House starts: gives each Samsung/DLNA TV a controlled prebuffer window before its learned staggered Play command, then streams normally while the stable v0.13.3 clock/rendezvous controller handles residual drift."
          }
          EOF
          git add latest.json
          git commit -m 'Select LocalWave v0.13.4 as latest'
          git push origin HEAD:release-feed
      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v0.13.4.yml
          git commit -m 'Remove temporary v0.13.4 publisher'
          git push origin HEAD:release-feed
# trigger after workflow registration
