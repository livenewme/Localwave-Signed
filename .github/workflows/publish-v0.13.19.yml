name: Publish LocalWave v0.13.19 once

on:
  push:
    branches: [main]
    paths:
      - '.publish-v0.13.19'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-76d0-81fd-b44c-969c5dc50855/raw?se=2026-08-24T01%3A26%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=3b0e0937-072e-5666-a115-e7ac5d347e3f&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T14%3A32%3A35Z&ske=2026-08-24T14%3A32%3A35Z&sks=b&skv=2026-02-06&sig=w0f0Bj9dVP%2BNX8F27L2GhBxGPvrgNynojiclNckrbk8%3D' -o /tmp/localwave-ci.zip
          rm -rf /tmp/localwave-ci
          mkdir -p /tmp/localwave-ci
          unzip -q /tmp/localwave-ci.zip -d /tmp/localwave-ci
          APK=$(find /tmp/localwave-ci -type f -name '*.apk' | head -n1)
          test -n "$APK"
          test "$(stat -c '%s' "$APK")" = '2938532'
          echo 'b8424ad6805b26ac4679b788e7591c1e2de443494a8f6092e47c4cc2d3d4ceaa  '"$APK" | sha256sum -c -
          cp "$APK" /tmp/LocalWave-v0.13.19-release-signed.apk

      - name: Publish APK first and manifest last
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout release-feed
          python3 - <<'PY'
          import json
          with open('latest.json', encoding='utf-8') as f:
              latest=json.load(f)
          assert latest['versionCode'] == 52, latest
          PY
          test ! -e releases/v0.13.19
          mkdir -p releases/v0.13.19
          cp /tmp/LocalWave-v0.13.19-release-signed.apk releases/v0.13.19/LocalWave-v0.13.19-release-signed.apk
          printf '%s  %s\n' 'b8424ad6805b26ac4679b788e7591c1e2de443494a8f6092e47c4cc2d3d4ceaa' 'LocalWave-v0.13.19-release-signed.apk' > releases/v0.13.19/LocalWave-v0.13.19-release-signed.apk.sha256
          cat > releases/v0.13.19/README.md <<'EOF'
          # LocalWave v0.13.19

          Fixes Roku remote Previous/Next/Play-Pause controls and replaces the rough footer text with polished centered control cards while preserving the working Roku audio/artwork transport.
          EOF
          git add releases/v0.13.19
          git commit -m 'Publish LocalWave v0.13.19 APK'
          git push origin release-feed
          cat > latest.json <<'EOF'
          {
            "versionCode": 53,
            "versionName": "0.13.19",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.19/LocalWave-v0.13.19-release-signed.apk",
            "sha256": "b8424ad6805b26ac4679b788e7591c1e2de443494a8f6092e47c4cc2d3d4ceaa",
            "releaseNotes": "Fixes Roku remote Previous/Next/Play-Pause controls and polishes the Roku Now Playing footer with compact centered control cards while preserving the working Roku audio/artwork transport."
          }
          EOF
          git add latest.json
          git commit -m 'Advance latest feed to LocalWave v0.13.19'
          git push origin release-feed

      - name: Remove one-shot publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git rm -f .github/workflows/publish-v0.13.19.yml .publish-v0.13.19
          git commit -m 'Remove one-shot v0.13.19 publisher'
          git push origin main
