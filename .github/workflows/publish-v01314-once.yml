name: Publish v0.13.14 once

on:
  push:
    branches:
      - release-feed

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 66fe96cd8a0ec866052d11755e2a43c4e617fb32c54fedbf84a0f8ec00e79dee
      EXPECTED_SIZE: '2934380'
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-24a0-81fd-b443-df59d39d1381/raw?se=2026-08-22T06%3A02%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=db0b7841-2f2c-5bf1-84fa-a8ae958390bf&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A47%3A25Z&ske=2026-08-23T00%3A47%3A25Z&sks=b&skv=2026-02-06&sig=ZgNkfZcSaHrFhFxZcs%2BOmdZPIeSTT0s6fdx0dD36Qvg%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v01314.zip
          mkdir -p /tmp/localwave-v01314
          unzip -q /tmp/localwave-v01314.zip -d /tmp/localwave-v01314
          apk=/tmp/localwave-v01314/LocalWave-v0.13.14-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -
      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 47:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          if Path('releases/v0.13.14').exists():
              raise SystemExit('Refusing to overwrite existing v0.13.14 release directory')
          PY
          mkdir -p releases/v0.13.14
          cp /tmp/localwave-v01314/LocalWave-v0.13.14-release-signed.apk releases/v0.13.14/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.14-release-signed.apk' > releases/v0.13.14/LocalWave-v0.13.14-release-signed.apk.sha256
          cat > releases/v0.13.14/README.md <<'EOF'
          # LocalWave v0.13.14

          Adds persistent playback-session restore and backfills/repairs the in-app changelog through the current release.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.14
          git commit -m 'publish LocalWave v0.13.14 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 48,
            "versionName": "0.13.14",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.14/LocalWave-v0.13.14-release-signed.apk",
            "sha256": "66fe96cd8a0ec866052d11755e2a43c4e617fb32c54fedbf84a0f8ec00e79dee",
            "releaseNotes": "Adds persistent playback-session restore so LocalWave can recover your queue, current track, position, play/pause state, shuffle and repeat after process recreation. Also backfills the in-app changelog from v0.13.10 through v0.13.14 and adds a maintainable recent-release changelog layer."
          }
          EOF
          rm -f .github/workflows/publish-v01314-once.yml
          rm -f .publish-v01314-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.14'
          git push origin HEAD:release-feed
