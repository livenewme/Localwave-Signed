name: Publish LocalWave v0.10.1

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.10.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release feed
        uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Fetch and verify signed LocalWave artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b6f0-81fd-8173-66028bd98c5a/raw?se=2026-08-21T17%3A47%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=08588213-ba45-581b-9c92-38a7f02d4965&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T13%3A03%3A27Z&ske=2026-08-22T13%3A03%3A27Z&sks=b&skv=2026-02-06&sig=oo2tAMBGhaQTKQ2GYZ4SLi8VkPKrY6/nAVYyoKiHg68%3D'
          EXPECTED_SHA256: 'fb0399d4a8b0bef44909da07d29cf9b86043e4fc7332b480a39b9f8cd922b861'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/localwave-v0101"
          mkdir -p "$work"
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o "$work/artifact.zip"
          unzip -q "$work/artifact.zip" -d "$work/unpacked"
          apk="$work/unpacked/LocalWave-v0.10.1-release-signed.apk"
          test -f "$apk"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

          mkdir -p releases/v0.10.1
          cp "$apk" releases/v0.10.1/LocalWave-v0.10.1-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.10.1-release-signed.apk' \
            > releases/v0.10.1/LocalWave-v0.10.1-release-signed.apk.sha256
          cat > releases/v0.10.1/README.md <<'EOF'
          # LocalWave v0.10.1

          Chromecast chooser-theme repair for the v0.10.0 device failure `background can not be translucent: #0`.

          - Package: `app.localwave.player`
          - Version: `0.10.1`
          - versionCode: `27`
          - SHA-256: `fb0399d4a8b0bef44909da07d29cf9b86043e4fc7332b480a39b9f8cd922b861`
          - Signer certificate: unchanged from v0.10.0 / v0.9.1
          - APK Signature Schemes: v2 and v3

          The Cast activity now uses its own opaque AppCompat-compatible theme while the ordinary LocalWave launcher and local playback startup path remain unchanged.
          EOF

      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/v0.10.1
          git commit -m 'Publish LocalWave v0.10.1 APK'
          git push origin HEAD:release-feed

      - name: Activate v0.10.1 manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 27,
            "versionName": "0.10.1",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.10.1/LocalWave-v0.10.1-release-signed.apk",
            "sha256": "fb0399d4a8b0bef44909da07d29cf9b86043e4fc7332b480a39b9f8cd922b861",
            "releaseNotes": "Chromecast fix: repairs the AndroidX MediaRouter chooser failure 'background can not be translucent: #0' seen in v0.10.0. The Cast screen now has its own opaque AppCompat-compatible theme while normal LocalWave startup remains isolated from Cast."
          }
          EOF
          cat > README.md <<'EOF'
          # LocalWave signed release feed

          This branch is the live update feed for LocalWave.

          - Current version: 0.10.1
          - versionCode: 27
          - Package: app.localwave.player
          - APK SHA-256: fb0399d4a8b0bef44909da07d29cf9b86043e4fc7332b480a39b9f8cd922b861
          - Signer certificate SHA-256: 58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba

          v0.10.1 fixes the first physical-device failure found in the isolated Chromecast retry. v0.10.0 launched normally but AndroidX MediaRouter rejected a missing AppCompat theme color as transparent. v0.10.1 gives only the Cast activity a fully opaque AppCompat-compatible theme and leaves normal LocalWave startup on the previously accepted path.

          The updater reads `latest.json`, verifies trusted HTTPS hosts, checks the APK SHA-256, then validates package name, version code, and signing certificate before installation.
          EOF
          git add latest.json README.md
          git commit -m 'Activate LocalWave v0.10.1'
          git push origin HEAD:release-feed

      - name: Remove one-shot publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v0.10.1.yml
          git commit -m 'Remove one-shot v0.10.1 publisher'
          git push origin HEAD:release-feed
