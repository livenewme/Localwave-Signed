name: Publish v0.13.13 once

on:
  push:
    branches:
      - release-feed

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 6c8c49f6a45e6b1adb0668d7bf1f760f40e67c74c23956b396399f5f41e2f908
      EXPECTED_SIZE: '2930229'
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-bc48-81fd-9bf1-9b6e1a20e4f5/raw?se=2026-08-22T05%3A46%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=ba7fb7f5-dcb9-5098-a79c-3e49dd2ca41e&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A45%3A47Z&ske=2026-08-23T00%3A45%3A47Z&sks=b&skv=2026-02-06&sig=oZzLXX8ELYSXAMiulpXr79JzQUdTw62Mw%2BejfOlY3%2BY%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v01313.zip
          mkdir -p /tmp/localwave-v01313
          unzip -q /tmp/localwave-v01313.zip -d /tmp/localwave-v01313
          apk=/tmp/localwave-v01313/LocalWave-v0.13.13-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -
      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 46:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          if Path('releases/v0.13.13').exists():
              raise SystemExit('Refusing to overwrite existing v0.13.13 release directory')
          PY
          mkdir -p releases/v0.13.13
          cp /tmp/localwave-v01313/LocalWave-v0.13.13-release-signed.apk releases/v0.13.13/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.13-release-signed.apk' > releases/v0.13.13/LocalWave-v0.13.13-release-signed.apk.sha256
          cat > releases/v0.13.13/README.md <<'EOF'
          # LocalWave v0.13.13

          Adds app-wide preset themes, Match song album-art theming, an isolated ThemeRenderer subsystem, and improved Smart button spacing.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.13
          git commit -m 'publish LocalWave v0.13.13 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 47,
            "versionName": "0.13.13",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.13/LocalWave-v0.13.13-release-signed.apk",
            "sha256": "6c8c49f6a45e6b1adb0668d7bf1f760f40e67c74c23956b396399f5f41e2f908",
            "releaseNotes": "Adds Settings > Themes with several preset palettes and Match song, which follows the current album artwork. Also isolates visual rendering behind ThemeRenderer and gives the Smart button more room."
          }
          EOF
          rm -f .github/workflows/publish-v01313-once.yml
          rm -f .publish-v01313-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.13'
          git push origin HEAD:release-feed
