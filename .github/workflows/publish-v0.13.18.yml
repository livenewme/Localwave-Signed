name: Publish LocalWave v0.13.18 once

on:
  push:
    branches: [main]
    paths:
      - '.publish-v0.13.18'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/livenewme/LocalWave/actions/artifacts/9501490513/zip' \
            -o /tmp/localwave-ci.zip
          rm -rf /tmp/localwave-ci
          mkdir -p /tmp/localwave-ci
          unzip -q /tmp/localwave-ci.zip -d /tmp/localwave-ci
          APK=$(find /tmp/localwave-ci -type f -name '*.apk' | head -n1)
          test -n "$APK"
          test "$(stat -c '%s' "$APK")" = '2938532'
          echo 'bbc0e920eb2259f51502ac12fea5a35bef0b3e7276612489db926ef5dd59410d  '"$APK" | sha256sum -c -
          cp "$APK" /tmp/LocalWave-v0.13.18-release-signed.apk

      - name: Publish APK first and manifest last
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout release-feed
          python3 - <<'PY'
          import json
          with open('latest.json', encoding='utf-8') as f:
              latest=json.load(f)
          assert latest['versionCode'] == 51, latest
          PY
          test ! -e releases/v0.13.18
          mkdir -p releases/v0.13.18
          cp /tmp/LocalWave-v0.13.18-release-signed.apk releases/v0.13.18/LocalWave-v0.13.18-release-signed.apk
          printf '%s  %s\n' 'bbc0e920eb2259f51502ac12fea5a35bef0b3e7276612489db926ef5dd59410d' 'LocalWave-v0.13.18-release-signed.apk' > releases/v0.13.18/LocalWave-v0.13.18-release-signed.apk.sha256
          cat > releases/v0.13.18/README.md <<'EOF'
          # LocalWave v0.13.18

          Roku Now Playing screen: album artwork, track metadata, queue position, playback state, elapsed/duration timing, progress bar, and a visible control strip while preserving the existing working Roku audio transport.
          EOF
          git add releases/v0.13.18
          git commit -m 'Publish LocalWave v0.13.18 APK'
          git push origin release-feed
          cat > latest.json <<'EOF'
          {
            "versionCode": 52,
            "versionName": "0.13.18",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.18/LocalWave-v0.13.18-release-signed.apk",
            "sha256": "bbc0e920eb2259f51502ac12fea5a35bef0b3e7276612489db926ef5dd59410d",
            "releaseNotes": "Adds a real Roku Now Playing screen with album artwork, title/artist/album, queue position, play state, elapsed/duration timing, a live progress bar, and a TV control strip while preserving the working Roku audio transport."
          }
          EOF
          git add latest.json
          git commit -m 'Advance latest feed to LocalWave v0.13.18'
          git push origin release-feed

      - name: Remove one-shot publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git rm -f .github/workflows/publish-v0.13.18.yml .publish-v0.13.18
          git commit -m 'Remove one-shot v0.13.18 publisher'
          git push origin main
