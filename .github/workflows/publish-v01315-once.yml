name: Publish v0.13.15 once

on:
  push:
    branches:
      - release-feed

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: bee18edeee865e07f1ececbc02667067f47a21af34becff75c1f64fda2d8db53
      EXPECTED_SIZE: '2934380'
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9e10-81fd-82ba-22180de9c798/raw?se=2026-08-22T08%3A56%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e3343ad9-b06e-5724-bc5d-dc418488c0c4&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A45%3A51Z&ske=2026-08-23T00%3A45%3A51Z&sks=b&skv=2026-02-06&sig=y2fFnudITk8wAsoqgcz5hZ6D7dn/Am0exCp/RRSITOc%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v01315.zip
          mkdir -p /tmp/localwave-v01315
          unzip -q /tmp/localwave-v01315.zip -d /tmp/localwave-v01315
          apk=/tmp/localwave-v01315/LocalWave-v0.13.15-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -
      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 48:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          if Path('releases/v0.13.15').exists():
              raise SystemExit('Refusing to overwrite existing v0.13.15 release directory')
          PY
          mkdir -p releases/v0.13.15
          cp /tmp/localwave-v01315/LocalWave-v0.13.15-release-signed.apk releases/v0.13.15/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.15-release-signed.apk' > releases/v0.13.15/LocalWave-v0.13.15-release-signed.apk.sha256
          cat > releases/v0.13.15/README.md <<'EOF'
          # LocalWave v0.13.15

          Adds horizontal swipe navigation on the full Now Playing artwork: swipe left for Next and right for Previous, with deliberate gesture thresholds to prevent accidental skips.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.15
          git commit -m 'publish LocalWave v0.13.15 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 49,
            "versionName": "0.13.15",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.15/LocalWave-v0.13.15-release-signed.apk",
            "sha256": "bee18edeee865e07f1ececbc02667067f47a21af34becff75c1f64fda2d8db53",
            "releaseNotes": "Adds swipe track navigation in full Now Playing: swipe left on the album artwork for Next and swipe right for Previous. Gesture thresholds reduce accidental skips, and the recent changelog is updated through v0.13.15."
          }
          EOF
          rm -f .github/workflows/publish-v01315-once.yml
          rm -f .publish-v01315-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.15'
          git push origin HEAD:release-feed
