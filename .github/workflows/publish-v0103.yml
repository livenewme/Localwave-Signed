name: Publish LocalWave v0.10.3

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0103.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release feed
        uses: actions/checkout@v4
        with:
          ref: release-feed

      - name: Download and verify signed artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_url='https://sdmntprwestus3.oaiusercontent.com/files/00000000-7530-81fd-a72e-d8904c245604/raw?se=2026-08-21T18%3A49%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=132a6314-341d-5c53-9ad0-60078a99fbc5&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A08%3A19Z&ske=2026-08-21T22%3A08%3A19Z&sks=b&skv=2026-02-06&sig=JrAJYc2d1ARDozy0r/EEFrZzPvUM326Un9HF62i41TQ%3D'
          curl --fail --location --silent --show-error "$artifact_url" -o /tmp/localwave-v0103.zip
          rm -rf /tmp/localwave-v0103
          mkdir -p /tmp/localwave-v0103
          unzip -q /tmp/localwave-v0103.zip -d /tmp/localwave-v0103
          apk=/tmp/localwave-v0103/LocalWave-v0.10.3-release-signed.apk
          test -f "$apk"
          echo '79a68c819c2d7756bcbee4472355e90fad979286b484dc6f0b9b5e42df6c17f6  /tmp/localwave-v0103/LocalWave-v0.10.3-release-signed.apk' | sha256sum -c -

      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.10.3
          cp /tmp/localwave-v0103/LocalWave-v0.10.3-release-signed.apk releases/v0.10.3/LocalWave-v0.10.3-release-signed.apk
          printf '%s  %s\n' \
            '79a68c819c2d7756bcbee4472355e90fad979286b484dc6f0b9b5e42df6c17f6' \
            'LocalWave-v0.10.3-release-signed.apk' \
            > releases/v0.10.3/LocalWave-v0.10.3-release-signed.apk.sha256
          cat > releases/v0.10.3/README.md <<'EOF'
          # LocalWave v0.10.3

          - versionCode: 29
          - Package: `app.localwave.player`
          - Signed APK SHA-256: `79a68c819c2d7756bcbee4472355e90fad979286b484dc6f0b9b5e42df6c17f6`
          - Signer certificate SHA-256: `58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba`

          Adds album-art metadata to Samsung/DLNA TV playback. LocalWave sends the phone-hosted authenticated artwork URL as standard `upnp:albumArtURI` plus Samsung `sec:AlbumArtURI` while preserving the working v0.10.2 audio route.
          EOF
          git config user.name 'LocalWave Release Bot'
          git config user.email 'localwave-release@users.noreply.github.com'
          git add releases/v0.10.3
          git commit -m 'Publish LocalWave v0.10.3 APK'
          git push origin HEAD:release-feed

      - name: Activate v0.10.3 manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 29,
            "versionName": "0.10.3",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.10.3/LocalWave-v0.10.3-release-signed.apk",
            "sha256": "79a68c819c2d7756bcbee4472355e90fad979286b484dc6f0b9b5e42df6c17f6",
            "releaseNotes": "Samsung/DLNA TV artwork: sends LocalWave's authenticated phone-hosted album artwork URL to compatible TVs using standard UPnP album-art metadata plus Samsung compatibility metadata."
          }
          EOF
          cat > README.md <<'EOF'
          # LocalWave signed release feed

          This branch is the live update feed for LocalWave.

          - Current version: 0.10.3
          - versionCode: 29
          - Package: app.localwave.player
          - APK SHA-256: 79a68c819c2d7756bcbee4472355e90fad979286b484dc6f0b9b5e42df6c17f6
          - Signer certificate SHA-256: 58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba

          v0.10.3 keeps the device-accepted Samsung/DLNA audio route from v0.10.2 and adds receiver-facing album artwork metadata while retaining isolated Google Cast support.

          Releases are published APK-first and manifest-last. The updater verifies trusted HTTPS hosts, APK SHA-256, package name, version code, and the pinned LocalWave signing certificate before installation.
          EOF
          git add latest.json README.md
          git commit -m 'Activate LocalWave v0.10.3'
          git push origin HEAD:release-feed

      - name: Remove one-shot publisher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin release-feed || true
          if [[ -f .github/workflows/publish-v0103.yml ]]; then
            git rm .github/workflows/publish-v0103.yml
            git commit -m 'Remove v0.10.3 publisher'
            git push origin HEAD:release-feed
          fi
