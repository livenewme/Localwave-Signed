name: Publish LocalWave v0.11.1

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.11.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Publish verified APK then activate feed
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-3af0-81fd-8e4c-72c2d79e3a4c/raw?se=2026-08-21T19%3A36%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=7f9157c0-e089-5703-b95e-fcce6a2387e6&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T14%3A04%3A35Z&ske=2026-08-22T14%3A04%3A35Z&sks=b&skv=2026-02-06&sig=m1jtMw%2BguZZzn%2Bta44%2B5f5SvDyKs2XkY79MqQe%2BsjU0%3D'
          EXPECTED_SHA256: 'ccda74fa3c345f5eda0057ea64a678ac97faabae8f847e34996e2ea2a66be7e2'
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'

          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-artifact.zip
          rm -rf /tmp/localwave-artifact
          mkdir -p /tmp/localwave-artifact
          unzip -q /tmp/localwave-artifact.zip -d /tmp/localwave-artifact
          source_apk=/tmp/localwave-artifact/LocalWave-v0.11.1-release-signed.apk
          test -f "$source_apk"
          actual="$(sha256sum "$source_apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          test "$(stat -c %s "$source_apk")" = '2884837'

          mkdir -p releases/v0.11.1
          cp "$source_apk" releases/v0.11.1/LocalWave-v0.11.1-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.11.1-release-signed.apk' > releases/v0.11.1/LocalWave-v0.11.1-release-signed.apk.sha256
          cat > releases/v0.11.1/README.md <<'EOF'
          # LocalWave v0.11.1

          Active Whole House synchronization repair after physical multi-room Samsung testing found several-second offsets in v0.11.0.

          - Faster ~700 ms DLNA state/position polling while connected
          - Automatic correction begins after ~1.2 seconds
          - ~1.1 second drift threshold
          - ~2.2 second correction cooldown
          - Longer manual Resync pause/seek/start barrier
          - Google Cast, single-TV DLNA, metadata/artwork, and startup isolation preserved
          EOF
          git add releases/v0.11.1
          git commit -m 'Publish LocalWave v0.11.1 signed APK'
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionCode": 31,
            "versionName": "0.11.1",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.11.1/LocalWave-v0.11.1-release-signed.apk",
            "sha256": "ccda74fa3c345f5eda0057ea64a678ac97faabae8f847e34996e2ea2a66be7e2",
            "releaseNotes": "Active Whole House synchronization: much faster Samsung/DLNA position polling and drift correction to eliminate the multi-second room-to-room delay observed in v0.11.0."
          }
          EOF
          git add latest.json
          git commit -m 'Activate LocalWave v0.11.1 update feed'
          git push origin HEAD:release-feed

          rm .github/workflows/publish-v0.11.1.yml
          git add -A
          git commit -m 'Remove temporary v0.11.1 publisher'
          git push origin HEAD:release-feed
