name: Publish v0.13.9 once

on:
  push:
    branches:
      - release-feed

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 67b669c42227d796a718696a888324920d9fbdbf50ae96a75b0503d179187acb
      EXPECTED_SIZE: '2905317'
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ae8c-81fd-acf0-80df4610d412/raw?se=2026-08-22T03%3A30%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=39e0186d-f793-5a51-bd63-5ae4c5784955&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A44%3A28Z&ske=2026-08-23T00%3A44%3A28Z&sks=b&skv=2026-02-06&sig=hiZUiRSZu7BGpLjRSN45dhYU0If3hzIGtVvVfFKq%2BNw%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v0139.zip
          mkdir -p /tmp/localwave-v0139
          unzip -q /tmp/localwave-v0139.zip -d /tmp/localwave-v0139
          apk=/tmp/localwave-v0139/LocalWave-v0.13.9-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -
      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 42:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          PY
          mkdir -p releases/v0.13.9
          cp /tmp/localwave-v0139/LocalWave-v0.13.9-release-signed.apk releases/v0.13.9/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.9-release-signed.apk' > releases/v0.13.9/LocalWave-v0.13.9-release-signed.apk.sha256
          cat > releases/v0.13.9/README.md <<'EOF'
          # LocalWave v0.13.9

          Annealed automatic Whole House calibration: aligned start, progressively stricter timing-point collection, at most one correction, fresh verification, then a latched hands-off state.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.9
          git commit -m 'publish LocalWave v0.13.9 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 43,
            "versionName": "0.13.9",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.9/LocalWave-v0.13.9-release-signed.apk",
            "sha256": "67b669c42227d796a718696a888324920d9fbdbf50ae96a75b0503d179187acb",
            "releaseNotes": "Whole House automatic synchronization is now a conservative annealed calibration cycle: align timestamps, start together, collect progressively stricter delay points, make at most one justified correction, verify from scratch, then leave playback alone."
          }
          EOF
          rm -f .github/workflows/publish-v0139-once.yml
          rm -f .publish-v0139-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.9'
          git push origin HEAD:release-feed
