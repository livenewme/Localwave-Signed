name: Publish LocalWave v0.13.23 once

on:
  push:
    branches: [main]
    paths:
      - .publish-v01323-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-a9e0-81f7-a8df-ea4486fc6305/raw?se=2026-08-24T17%3A37%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=43de0078-65b7-5737-a5fd-6ed77fac53b4&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T15%3A15%3A07Z&ske=2026-08-25T15%3A15%3A07Z&sks=b&skv=2026-02-06&sig=xp91wst69BCx43WthqJkp86GGWACR6ZgN7rl/4KAEeE%3D"
      EXPECTED_SHA: "6f44abfaab3a95dc8dd089cf037fe8cfa1d0202e32031f9d8697dc68b22eb103"
      EXPECTED_SIZE: "3028883"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/candidate.zip
          rm -rf /tmp/candidate && mkdir -p /tmp/candidate
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          APK=/tmp/candidate/LocalWave-v0.13.23-release-signed.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  $APK" | sha256sum -c -

      - name: Publish APK first and manifest last
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LocalWave Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin release-feed
          git checkout release-feed
          grep -q '"versionCode": 56' latest.json
          test ! -e releases/v0.13.23
          mkdir -p releases/v0.13.23
          cp /tmp/candidate/LocalWave-v0.13.23-release-signed.apk releases/v0.13.23/
          printf '%s  %s\n' "$EXPECTED_SHA" "LocalWave-v0.13.23-release-signed.apk" > releases/v0.13.23/LocalWave-v0.13.23-release-signed.apk.sha256
          cat > releases/v0.13.23/README.md <<'EOF'
          # LocalWave v0.13.23

          Experimental Speaker Hold for Bluetooth multipoint speakers. Disabled by default; uses short, burst-limited silent claim pulses while LocalWave is paused.
          EOF
          git add releases/v0.13.23
          git commit -m "Publish LocalWave v0.13.23 signed APK"
          git push origin release-feed
          cat > latest.json <<'EOF'
          {
            "versionCode": 57,
            "versionName": "0.13.23",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.23/LocalWave-v0.13.23-release-signed.apk",
            "sha256": "6f44abfaab3a95dc8dd089cf037fe8cfa1d0202e32031f9d8697dc68b22eb103",
            "releaseNotes": "Adds Experimental Speaker Hold for Bluetooth multipoint speakers: short burst-limited silent claim pulses can attempt to reclaim the audio route while LocalWave is paused, with automatic backoff and no activity during Cast, Roku, or DLNA playback."
          }
          EOF
          git add latest.json
          git commit -m "Advance latest feed to LocalWave v0.13.23"
          git push origin release-feed

      - name: Remove one-shot publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          rm -f .publish-v01323-trigger .github/workflows/publish-v01323.yml
          git add -A
          git commit -m "Remove v0.13.23 one-shot publisher"
          git push origin main
