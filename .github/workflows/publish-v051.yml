name: Publish LocalWave v0.5.1

on:
  push:
    branches: [ "main" ]
    paths:
      - "staging/v0.5.1/READY.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Android verification tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null

      - name: Reconstruct exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root = Path('staging/v0.5.1')
          meta = json.loads((root / 'READY.json').read_text())
          parts = int(meta['parts'])
          expected = meta['sha256'].lower()
          chunks = []
          for i in range(parts):
              p = root / f'part-{i:04d}.b64'
              if not p.is_file():
                  raise SystemExit(f'missing {p}')
              chunks.append(''.join(p.read_text(encoding='ascii').split()))
          raw = base64.b64decode(''.join(chunks), validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual} != {expected}')
          Path('/tmp/LocalWave-v0.5.1.apk').write_bytes(raw)
          print('APK SHA-256:', actual)
          PY

      - name: Verify Android identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/LocalWave-v0.5.1.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          EXPECTED_CERT='34d98c603a2a2c54777c0065ecc3e38c3a4162d4f37d09ae137d004654d39a72'
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          CERT=$(sed -n 's/^.*Signer: certificate SHA-256 digest: //p; s/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "$EXPECTED_CERT"
          BADGING=$("$BT/aapt" dump badging "$APK" | head -1)
          echo "$BADGING"
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = 'app.localwave.player'
          test "$VERSION_CODE" = '17'
          test "$VERSION_NAME" = '0.5.1'

      - name: Publish release and endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.5.1
          test ! -e releases/v0.5.1/LocalWave-v0.5.1.apk
          cp /tmp/LocalWave-v0.5.1.apk releases/v0.5.1/LocalWave-v0.5.1.apk
          cat > releases/v0.5.1/release.json <<'JSON'
          {
            "versionCode": 17,
            "versionName": "0.5.1",
            "fileName": "LocalWave-v0.5.1.apk",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/main/releases/v0.5.1/LocalWave-v0.5.1.apk",
            "sha256": "98c07c4886841da123160fc67b9eb7e5eeef896a3fda166a48aac0b8fb0e5cb5",
            "packageName": "app.localwave.player",
            "certificateSha256": "34d98c603a2a2c54777c0065ecc3e38c3a4162d4f37d09ae137d004654d39a72",
            "releaseNotes": "Moves LocalWave update delivery to the dedicated public Localwave-Signed repository while preserving package, hash, signer-continuity, sealed-cache, and PackageInstaller verification."
          }
          JSON
          cp releases/v0.5.1/release.json current01.json
          rm -rf staging/v0.5.1
          rm -f .github/workflows/publish-v051.yml
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish LocalWave v0.5.1 [skip ci]'
          git push
