name: Publish LocalWave v0.13.1

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/publish-v0.13.1-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Download and verify signed candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-8508-81fd-b4ba-e44514e01830/raw?se=2026-08-21T22%3A09%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=a510c37f-13d9-581f-86e8-3a0c88c3aa6b&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T16%3A43%3A33Z&ske=2026-08-22T16%3A43%3A33Z&sks=b&skv=2026-02-06&sig=giucAA60KO2TVZFr8SBAzH3mif4wSBrZUVC%2BuHzEQVg%3D' -o /tmp/localwave-v0.13.1.zip
          rm -rf /tmp/lw131 && mkdir /tmp/lw131
          unzip -q /tmp/localwave-v0.13.1.zip -d /tmp/lw131
          apk=/tmp/lw131/LocalWave-v0.13.1-release-signed.apk
          sum=/tmp/lw131/LocalWave-v0.13.1-release-signed.apk.sha256
          test -f "$apk"
          test -f "$sum"
          echo '3797d42549ed1b2c2446862fa38ac320a0d3ca2cc686524cddf3b68a4c74cb64  /tmp/lw131/LocalWave-v0.13.1-release-signed.apk' | sha256sum -c -
          grep -Fq '3797d42549ed1b2c2446862fa38ac320a0d3ca2cc686524cddf3b68a4c74cb64' "$sum"
          test "$(stat -c %s "$apk")" = '2888933'

      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.13.1
          cp /tmp/lw131/LocalWave-v0.13.1-release-signed.apk releases/v0.13.1/
          cp /tmp/lw131/LocalWave-v0.13.1-release-signed.apk.sha256 releases/v0.13.1/
          cat > releases/v0.13.1/README.md <<'EOF'
          # LocalWave v0.13.1

          versionCode: 35

          SHA-256: `3797d42549ed1b2c2446862fa38ac320a0d3ca2cc686524cddf3b68a4c74cb64`

          v0.13.1 is a selective-DRY maintenance release. It centralizes local search, playlist/queue prompt plumbing, row artwork loading, and row duration presentation while deliberately preserving isolation where sharing would couple fragile features. The TV activity now owns independent window/inset chrome, receiver artwork remains separate from local UI artwork, and CI enforces those boundaries.
          EOF
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add releases/v0.13.1
          git commit -m 'Publish signed LocalWave v0.13.1 APK'
          git push origin HEAD:release-feed

      - name: Activate manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 35,
            "versionName": "0.13.1",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.1/LocalWave-v0.13.1-release-signed.apk",
            "sha256": "3797d42549ed1b2c2446862fa38ac320a0d3ca2cc686524cddf3b68a4c74cb64",
            "releaseNotes": "Selective DRY maintenance: centralizes safe local UI/search/artwork helpers while deliberately isolating fragile TV/Cast paths. Adds build-enforced protected-duplication rules with no intended playback or Whole House behavior changes."
          }
          EOF
          cat > README.md <<'EOF'
          # LocalWave signed release feed

          This branch is the live update feed for LocalWave.

          - Current version: 0.13.1
          - versionCode: 35
          - Package: app.localwave.player
          - APK SHA-256: 3797d42549ed1b2c2446862fa38ac320a0d3ca2cc686524cddf3b68a4c74cb64
          - Signer certificate SHA-256: 58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba

          v0.13.1 performs a selective DRY cleanup while preserving deliberate isolation between ordinary UI and fragile TV/Cast behavior.

          Releases are published APK-first and manifest-last. The updater verifies trusted HTTPS hosts, APK SHA-256, package name, version code, and the pinned LocalWave signing certificate before installation.
          EOF
          git add latest.json README.md
          git commit -m 'Activate LocalWave v0.13.1 updater release'
          git push origin HEAD:release-feed

      - name: Remove temporary publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin release-feed
          git rm -f .github/workflows/publish-v0.13.1.yml .github/publish-v0.13.1-trigger
          git commit -m 'Remove temporary v0.13.1 publisher'
          git push origin HEAD:release-feed
