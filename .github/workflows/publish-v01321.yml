name: Publish LocalWave v0.13.21 once

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-v01321.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release feed
        uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Verify and publish exact CI artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-faa8-81fd-a136-97f900e4e95a/raw?se=2026-08-24T02%3A05%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=ce3b574d-57ce-5e2a-920f-fb3b5e324250&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T13%3A32%3A23Z&ske=2026-08-24T13%3A32%3A23Z&sks=b&skv=2026-02-06&sig=T2c5A3FH1z6U5QByEMjlz18lagvtwYBD4leij/D3NsE%3D"
          EXPECTED_SHA256: "f5fabd8df728ff3da25a0e0ea71c7300817604325d3b4c846dabed27f614b852"
          EXPECTED_SIZE: "3028883"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('latest.json','r',encoding='utf-8') as f:
              current=json.load(f)
          if int(current.get('versionCode',-1)) != 53:
              raise SystemExit(f"Refusing publication: expected live code 53, got {current.get('versionCode')}")
          PY
          test ! -e releases/v0.13.21
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/ci.zip
          rm -rf /tmp/ci && mkdir -p /tmp/ci
          unzip -q /tmp/ci.zip -d /tmp/ci
          APK="$(find /tmp/ci -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $APK" | sha256sum -c -

          git config user.name "LocalWave Release Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p releases/v0.13.21
          cp "$APK" releases/v0.13.21/LocalWave-v0.13.21-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.21-release-signed.apk' > releases/v0.13.21/LocalWave-v0.13.21-release-signed.apk.sha256
          cat > releases/v0.13.21/README.md <<'EOF'
          # LocalWave v0.13.21

          Roku-inspired Android Auto template UI with the v0.13.20 album-art fix included. Published from the exact signed CI artifact from LocalWave Build #276.
          EOF
          git add releases/v0.13.21
          git commit -m "Publish LocalWave v0.13.21 APK"
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionCode": 55,
            "versionName": "0.13.21",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.21/LocalWave-v0.13.21-release-signed.apk",
            "sha256": "f5fabd8df728ff3da25a0e0ea71c7300817604325d3b4c846dabed27f614b852",
            "releaseNotes": "Adds a Roku-inspired Android Auto experience with an artwork-forward LocalWave home screen, library grid, dedicated Now Playing media template, voice-compatible controls, and the Android Auto album-art fix."
          }
          EOF
          git add latest.json
          git commit -m "Advance latest to LocalWave v0.13.21"
          git push origin HEAD:release-feed

      - name: Remove one-shot publisher
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git rm -f .github/workflows/publish-v01321.yml .github/publish-v01321.trigger
          git commit -m "Remove v0.13.21 one-shot publisher"
          git push origin main
