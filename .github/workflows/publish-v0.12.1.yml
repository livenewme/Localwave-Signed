name: Publish LocalWave v0.12.1

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.12.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Publish verified APK then activate feed
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-3c64-81fd-b9dd-b686a083938f/raw?se=2026-08-21T20%3A40%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=90fd32b1-55b3-5727-b362-3fc6dd8fa2df&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T15%3A41%3A32Z&ske=2026-08-22T15%3A41%3A32Z&sks=b&skv=2026-02-06&sig=16f30V9lDF1g9AxZu6YKDKdyVVgVwcRgm6FjZkaJXFU%3D'
          EXPECTED_SHA256: '9917e5b0fc3c8d67417a184862454604dbdde02b60024167c9290d18eae9aacb'
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'

          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-artifact.zip
          rm -rf /tmp/localwave-artifact
          mkdir -p /tmp/localwave-artifact
          unzip -q /tmp/localwave-artifact.zip -d /tmp/localwave-artifact
          source_apk=/tmp/localwave-artifact/LocalWave-v0.12.1-release-signed.apk
          test -f "$source_apk"
          actual="$(sha256sum "$source_apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          test "$(stat -c %s "$source_apk")" = '2884837'

          mkdir -p releases/v0.12.1
          cp "$source_apk" releases/v0.12.1/LocalWave-v0.12.1-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.12.1-release-signed.apk' > releases/v0.12.1/LocalWave-v0.12.1-release-signed.apk.sha256
          cat > releases/v0.12.1/README.md <<'EOF'
          # LocalWave v0.12.1

          Samsung/DLNA receiver-backpressure repair after physical Q80CA testing exposed repeated HTTP 500 responses under v0.12.0 control polling.

          - Position polling reduced from ~350 ms to a receiver-friendly ~850 ms base rate
          - Steady-state transport polling decimated to ~2.5 seconds
          - Per-TV HTTP 429/500/503 backoff up to 5 seconds with gradual recovery
          - Transient busy polling responses no longer flash playback errors
          - Adaptive hold Pause aborts quietly when the receiver is busy
          - Busy hold resume gets bounded retries
          - v0.12.0 master clock, learned latency, artwork, Cast, and startup isolation preserved
          EOF
          git add releases/v0.12.1
          git commit -m 'Publish LocalWave v0.12.1 signed APK'
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionCode": 33,
            "versionName": "0.12.1",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.12.1/LocalWave-v0.12.1-release-signed.apk",
            "sha256": "9917e5b0fc3c8d67417a184862454604dbdde02b60024167c9290d18eae9aacb",
            "releaseNotes": "Samsung/DLNA backpressure fix: reduces AVTransport polling pressure, independently backs off busy TVs on HTTP 429/500/503, and suppresses transient receiver-busy errors while preserving adaptive Whole House clock synchronization."
          }
          EOF
          git add latest.json
          git commit -m 'Activate LocalWave v0.12.1 update feed'
          git push origin HEAD:release-feed

          rm .github/workflows/publish-v0.12.1.yml
          git add -A
          git commit -m 'Remove temporary v0.12.1 publisher'
          git push origin HEAD:release-feed
