name: Publish LocalWave v0.13.0

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/publish-v0.13.0-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Download and verify signed candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d07c-81fd-a7d6-953fa085968c/raw?se=2026-08-21T21%3A35%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=24147e5a-efed-524a-924e-69862501ead8&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T14%3A04%3A35Z&ske=2026-08-22T14%3A04%3A35Z&sks=b&skv=2026-02-06&sig=YLbM0fDrtV2B7e%2BGZvQT4Deo4TcnSKf0iHMa7yXpKkM%3D' -o /tmp/localwave-v0.13.0.zip
          rm -rf /tmp/lw13 && mkdir /tmp/lw13
          unzip -q /tmp/localwave-v0.13.0.zip -d /tmp/lw13
          apk=/tmp/lw13/LocalWave-v0.13.0-release-signed.apk
          sum=/tmp/lw13/LocalWave-v0.13.0-release-signed.apk.sha256
          test -f "$apk"
          test -f "$sum"
          echo 'ebbcf17df7bc98185b7e42f87b5fef47fa9b8f14d93e517a4dd87d0b22412cea  /tmp/lw13/LocalWave-v0.13.0-release-signed.apk' | sha256sum -c -
          grep -Fq 'ebbcf17df7bc98185b7e42f87b5fef47fa9b8f14d93e517a4dd87d0b22412cea' "$sum"

      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.13.0
          cp /tmp/lw13/LocalWave-v0.13.0-release-signed.apk releases/v0.13.0/
          cp /tmp/lw13/LocalWave-v0.13.0-release-signed.apk.sha256 releases/v0.13.0/
          cat > releases/v0.13.0/README.md <<'EOF'
          # LocalWave v0.13.0

          versionCode: 34

          SHA-256: `ebbcf17df7bc98185b7e42f87b5fef47fa9b8f14d93e517a4dd87d0b22412cea`

          v0.13.0 makes Play on TV a setup/management surface. After connecting Samsung/DLNA TVs, users can return to the normal LocalWave library/player, keep browsing, select new music, and use the normal playback controls while a persistent TV-route banner shows the active destination and reopens TV management when tapped.
          EOF
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add releases/v0.13.0
          git commit -m 'Publish signed LocalWave v0.13.0 APK'
          git push origin HEAD:release-feed

      - name: Activate manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 34,
            "versionName": "0.13.0",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.0/LocalWave-v0.13.0-release-signed.apk",
            "sha256": "ebbcf17df7bc98185b7e42f87b5fef47fa9b8f14d93e517a4dd87d0b22412cea",
            "releaseNotes": "TV playback usability: after connecting Samsung/DLNA TVs, return to the normal LocalWave library/player and keep browsing and controlling playback there. A persistent Playing on TV banner shows the active TV/group and opens TV management when tapped."
          }
          EOF
          cat > README.md <<'EOF'
          # LocalWave signed release feed

          This branch is the live update feed for LocalWave.

          - Current version: 0.13.0
          - versionCode: 34
          - Package: app.localwave.player
          - APK SHA-256: ebbcf17df7bc98185b7e42f87b5fef47fa9b8f14d93e517a4dd87d0b22412cea
          - Signer certificate SHA-256: 58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba

          v0.13.0 integrates an active Samsung/DLNA TV session into the normal LocalWave library/player. The Play on TV screen remains the setup/management surface, while normal playback controls and music selection continue working after returning to the main app. A persistent route banner identifies the connected TV/group.

          Releases are published APK-first and manifest-last. The updater verifies trusted HTTPS hosts, APK SHA-256, package name, version code, and the pinned LocalWave signing certificate before installation.
          EOF
          git add latest.json README.md
          git commit -m 'Activate LocalWave v0.13.0 updater release'
          git push origin HEAD:release-feed
