name: Publish v0.13.17 once

on:
  push:
    branches:
      - release-feed

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 58cb6c49ce6b229354da3fe28efadd2bc0bf6825ef174b73471557c177cb7400
      EXPECTED_SIZE: '2934436'
      ARTIFACT_URL: 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-0cf0-81fb-a461-9309a857c981/raw?se=2026-08-23T20%3A38%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=1b600595-b0b2-5e3e-af17-42e37a8bc3fe&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T23%3A50%3A00Z&ske=2026-08-23T23%3A50%3A00Z&sks=b&skv=2026-02-06&sig=mq5W7nlBda2w0ITpbYeQe37QY3FP31XCYq2eW0ZxgR0%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v01317.zip
          mkdir -p /tmp/localwave-v01317
          unzip -q /tmp/localwave-v01317.zip -d /tmp/localwave-v01317
          apk=/tmp/localwave-v01317/LocalWave-v0.13.17-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -
      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 50:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          if Path('releases/v0.13.17').exists():
              raise SystemExit('Refusing to overwrite existing v0.13.17 release directory')
          PY
          mkdir -p releases/v0.13.17
          cp /tmp/localwave-v01317/LocalWave-v0.13.17-release-signed.apk releases/v0.13.17/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.17-release-signed.apk' > releases/v0.13.17/LocalWave-v0.13.17-release-signed.apk.sha256
          cat > releases/v0.13.17/README.md <<'EOF'
          # LocalWave v0.13.17

          Adds Android Auto media browsing and playback controls for LocalWave's local Songs, Albums, Artists, Playlists, and Liked library while preserving the existing playback engine and TV-route isolation.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.17
          git commit -m 'publish LocalWave v0.13.17 signed APK'
          git push origin HEAD:release-feed
      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 51,
            "versionName": "0.13.17",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.17/LocalWave-v0.13.17-release-signed.apk",
            "sha256": "58cb6c49ce6b229354da3fe28efadd2bc0bf6825ef174b73471557c177cb7400",
            "releaseNotes": "Adds Android Auto support with car-display browsing for Songs, Albums, Artists, Playlists, and Liked tracks, plus Play/Pause, Previous/Next, Seek, metadata, queue-aware playback, and voice search while preserving Cast/DLNA/Roku isolation."
          }
          EOF
          rm -f .github/workflows/publish-v01317-once.yml
          rm -f .publish-v01317-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.17'
          git push origin HEAD:release-feed
