name: Publish LocalWave v0.12.0

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.12.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0
      - name: Publish verified APK then activate feed
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-5400-81fd-b7fb-e3896e6b42ee/raw?se=2026-08-21T20%3A14%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=788b19c4-58d6-5742-9626-6d98d4c5a0a1&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A15%3A23Z&ske=2026-08-21T22%3A15%3A23Z&sks=b&skv=2026-02-06&sig=h4SsjrJ7oZ20kR9r7aAFlqi4hFAkHrCCUCa3JLg6wnc%3D'
          EXPECTED_SHA256: 'a985817b6d9b7f8958b55c7e8db1bf82aab1938602d51028a55e2c5a9f80f77b'
          EXPECTED_SIZE: '2884837'
        run: |
          set -euo pipefail
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'

          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-artifact.zip
          rm -rf /tmp/localwave-artifact
          mkdir -p /tmp/localwave-artifact
          unzip -q /tmp/localwave-artifact.zip -d /tmp/localwave-artifact
          source_apk=/tmp/localwave-artifact/LocalWave-v0.12.0-release-signed.apk
          test -f "$source_apk"
          actual="$(sha256sum "$source_apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          test "$(stat -c %s "$source_apk")" = "$EXPECTED_SIZE"

          mkdir -p releases/v0.12.0
          cp "$source_apk" releases/v0.12.0/LocalWave-v0.12.0-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.12.0-release-signed.apk' > releases/v0.12.0/LocalWave-v0.12.0-release-signed.apk.sha256
          cat > releases/v0.12.0/README.md <<'EOF'
          # LocalWave v0.12.0

          Adaptive Whole House clock synchronization for Samsung/DLNA televisions.

          - Phone-side authoritative monotonic track clock
          - Per-TV adaptive software clocks from repeated DLNA position observations
          - Network RTT midpoint timestamp correction
          - Persistent learned Play-to-playing latency per television
          - Staggered starts so slower TVs are commanded earlier
          - ~350 ms active timing sampling
          - Sub-second correction by briefly holding early TVs instead of coarse fractional seeks
          - Late-TV master-clock rendezvous
          - Google Cast, single-TV DLNA, metadata/artwork, and startup isolation preserved
          EOF
          git add releases/v0.12.0
          git commit -m 'Publish LocalWave v0.12.0 signed APK'
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionCode": 32,
            "versionName": "0.12.0",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.12.0/LocalWave-v0.12.0-release-signed.apk",
            "sha256": "a985817b6d9b7f8958b55c7e8db1bf82aab1938602d51028a55e2c5a9f80f77b",
            "releaseNotes": "Adaptive Whole House clock: automatically learns each Samsung/DLNA TV's playback latency, staggers starts, interpolates coarse receiver clocks, and uses sub-second early-TV holds to keep rooms aligned without manual calibration."
          }
          EOF
          git add latest.json
          git commit -m 'Activate LocalWave v0.12.0 update feed'
          git push origin HEAD:release-feed

          rm .github/workflows/publish-v0.12.0.yml
          git add -A
          git commit -m 'Remove temporary v0.12.0 publisher'
          git push origin HEAD:release-feed
