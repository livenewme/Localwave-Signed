name: Publish LocalWave v0.13.2

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0132-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release feed
        uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Download and verify signed artifact
        env:
          SOURCE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d948-81fd-a1db-899c3377fe45/raw?se=2026-08-21T22%3A32%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=9731913a-b83b-5b2d-89a5-21bcec15c94e&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T21%3A08%3A32Z&ske=2026-08-22T21%3A08%3A32Z&sks=b&skv=2026-02-06&sig=zEGdqP7mOE1sWPNagJIlugdaG8%2BHuj986RYqAMJ7yGU%3D'
          EXPECTED_SHA256: '00083b861f74583d79edf86d4df18cd7710f17751e6e41cbd2ee0beb59ec6563'
          EXPECTED_SIZE: '2888933'
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/LocalWave-v0.13.2-release-signed.zip"
          dir="$RUNNER_TEMP/v0132"
          mkdir -p "$dir"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$zip"
          unzip -q "$zip" -d "$dir"
          apk="$dir/LocalWave-v0.13.2-release-signed.apk"
          test -f "$apk"
          actual_sha="$(sha256sum "$apk" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$apk")"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_size" = "$EXPECTED_SIZE"

          release_dir="releases/v0.13.2"
          mkdir -p "$release_dir"
          cp "$apk" "$release_dir/LocalWave-v0.13.2-release-signed.apk"
          printf '%s  LocalWave-v0.13.2-release-signed.apk\n' "$EXPECTED_SHA256" \
            > "$release_dir/LocalWave-v0.13.2-release-signed.apk.sha256"
          cat > "$release_dir/README.md" <<'EOF'
          # LocalWave v0.13.2

          Real queue-order Shuffle.

          Shuffle now physically reorders LocalWave's play queue and playback then follows that visible queue sequentially. The current song/history remain anchored when Shuffle is enabled mid-session, while new queues keep the selected song first and randomize the remaining tracks. Phone playback, Google Cast, and Samsung/DLNA/Whole House use the same queue ordering model.

          Package: `app.localwave.player`  
          versionCode: `36`
          EOF

          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add "$release_dir"
          git commit -m 'Publish LocalWave v0.13.2 signed APK'
          git push origin HEAD:release-feed

      - name: Activate updater manifest last
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 36,
            "versionName": "0.13.2",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.2/LocalWave-v0.13.2-release-signed.apk",
            "sha256": "00083b861f74583d79edf86d4df18cd7710f17751e6e41cbd2ee0beb59ec6563",
            "releaseNotes": "Shuffle now reorders the actual play queue instead of secretly choosing random next songs. The current song/history stay anchored, upcoming tracks are shuffled visibly, and Next follows that queue on phone, Google Cast, and Samsung/DLNA/Whole House."
          }
          EOF
          git add latest.json
          git commit -m 'Activate LocalWave v0.13.2 in latest.json'
          git push origin HEAD:release-feed
