name: Publish LocalWave v0.10.2

on:
  push:
    branches: [release-feed]
    paths:
      - '.github/workflows/publish-v0.10.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout release feed
        uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Download and verify signed artifact
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprwestus3.oaiusercontent.com/files/00000000-a790-81fd-b806-a02500c9928e/raw?se=2026-08-21T18%3A24%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=228fc07c-29dd-5b2f-a910-1a5646daa522&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T21%3A58%3A59Z&ske=2026-08-21T21%3A58%3A59Z&sks=b&skv=2026-02-06&sig=dahYUZlPgRU%2B19XkUUct39ON5sN6hpkP%2BH%2Bghkxfxek%3D'
          curl -fL --retry 3 --retry-delay 1 "$url" -o "$RUNNER_TEMP/release.zip"
          echo '71405bf4faf3799e91de9b79f8c33617ffefef6cd28c8bb393ba090afc93bf8e  '"$RUNNER_TEMP/release.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP/release.zip" -d "$RUNNER_TEMP/release"
          apk="$RUNNER_TEMP/release/LocalWave-v0.10.2-release-signed.apk"
          test -f "$apk"
          echo 'b8ac8988a9b07e3364fd546a231830fae1f7ab974f5277070a235083bef75a7d  '"$apk" | sha256sum -c -

      - name: Publish APK first
        shell: bash
        run: |
          set -euo pipefail
          release_dir='releases/v0.10.2'
          mkdir -p "$release_dir"
          cp "$RUNNER_TEMP/release/LocalWave-v0.10.2-release-signed.apk" "$release_dir/"
          printf '%s  %s\n' \
            'b8ac8988a9b07e3364fd546a231830fae1f7ab974f5277070a235083bef75a7d' \
            'LocalWave-v0.10.2-release-signed.apk' \
            > "$release_dir/LocalWave-v0.10.2-release-signed.apk.sha256"
          cat > "$release_dir/README.md" <<'EOF'
          # LocalWave v0.10.2

          Samsung / DLNA TV playback release.

          - Package: `app.localwave.player`
          - versionCode: `28`
          - APK SHA-256: `b8ac8988a9b07e3364fd546a231830fae1f7ab974f5277070a235083bef75a7d`
          - Signer certificate SHA-256: `58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba`

          Adds opt-in SSDP/UPnP AVTransport playback for Samsung TU690T-class and other compatible DLNA MediaRenderer TVs while preserving the isolated Google Cast route.
          EOF
          git config user.name 'LocalWave Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$release_dir"
          git commit -m 'Publish signed LocalWave v0.10.2 APK'
          git push origin HEAD:release-feed

      - name: Activate manifest last and clean publisher
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 28,
            "versionName": "0.10.2",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.10.2/LocalWave-v0.10.2-release-signed.apk",
            "sha256": "b8ac8988a9b07e3364fd546a231830fae1f7ab974f5277070a235083bef75a7d",
            "releaseNotes": "Play on TV: adds Samsung/DLNA discovery and direct local playback for Samsung TU690T-class and other compatible TVs while keeping Google Cast available. Start a song, open Play on TV, then scan for Samsung / DLNA TVs."
          }
          EOF
          cat > README.md <<'EOF'
          # LocalWave signed release feed

          This branch is the live update feed for LocalWave.

          - Current version: 0.10.2
          - versionCode: 28
          - Package: app.localwave.player
          - APK SHA-256: b8ac8988a9b07e3364fd546a231830fae1f7ab974f5277070a235083bef75a7d
          - Signer certificate SHA-256: 58d7c6616a809d769b4211cb21a16d37a018a112617184e2f4093cedfeb3e4ba

          v0.10.2 keeps the isolated Google Cast implementation and adds Samsung/DLNA TV discovery and direct local playback through standard SSDP/UPnP AVTransport. The initial hardware target is the Samsung TU690T family.

          Releases are published APK-first and manifest-last. The updater verifies trusted HTTPS hosts, APK SHA-256, package name, version code, and the pinned LocalWave signing certificate before installation.
          EOF
          git add latest.json README.md
          git rm .github/workflows/publish-v0.10.2.yml
          git commit -m 'Activate LocalWave v0.10.2 release feed'
          git push origin HEAD:release-feed
