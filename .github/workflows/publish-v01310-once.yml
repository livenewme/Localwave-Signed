name: Publish v0.13.10 once

on:
  push:
    branches:
      - release-feed
    paths:
      - '.publish-v01310-trigger'

permissions:
  contents: write

concurrency:
  group: publish-localwave-v01310
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: b5a698cf2133f709b0f1d6f86810af08e291144197132d6335e35a34745f97b2
      EXPECTED_SIZE: '2909469'
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ac00-81fd-99df-5cbde8abd68e/raw?se=2026-08-22T04%3A33%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=e503bbb0-6430-533b-af08-ec04b20d61ff&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A37%3A11Z&ske=2026-08-23T00%3A37%3A11Z&sks=b&skv=2026-02-06&sig=6%2Fabve0xGyjQehTN6FfyaibesA4pKu%2Fc2wHYSHMyF2Q%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
          fetch-depth: 0

      - name: Download and verify exact CI candidate
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/localwave-v01310.zip
          mkdir -p /tmp/localwave-v01310
          unzip -q /tmp/localwave-v01310.zip -d /tmp/localwave-v01310
          apk=/tmp/localwave-v01310/LocalWave-v0.13.10-release-signed.apk
          test -f "$apk"
          test "$(stat -c %s "$apk")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $apk" | sha256sum -c -

      - name: Publish APK first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current.get('versionCode') != 43:
              raise SystemExit(f"Refusing to advance from unexpected versionCode {current.get('versionCode')}")
          if Path('releases/v0.13.10').exists():
              raise SystemExit('Refusing to overwrite existing v0.13.10 release directory')
          PY
          mkdir -p releases/v0.13.10
          cp /tmp/localwave-v01310/LocalWave-v0.13.10-release-signed.apk releases/v0.13.10/
          printf '%s  %s\n' "$EXPECTED_SHA256" 'LocalWave-v0.13.10-release-signed.apk' > releases/v0.13.10/LocalWave-v0.13.10-release-signed.apk.sha256
          cat > releases/v0.13.10/README.md <<'EOF'
          # LocalWave v0.13.10

          Adds an opt-in Roku playback route using a LocalWave Receiver app on Roku and Roku's supported DIAL second-screen launch path. Samsung/DLNA synchronization and normal LocalWave startup remain isolated and unchanged.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.13.10
          git commit -m 'publish LocalWave v0.13.10 signed APK'
          git push origin HEAD:release-feed

      - name: Advance updater manifest last and remove publisher
        run: |
          set -euo pipefail
          cat > latest.json <<'EOF'
          {
            "versionCode": 44,
            "versionName": "0.13.10",
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Localwave-Signed/release-feed/releases/v0.13.10/LocalWave-v0.13.10-release-signed.apk",
            "sha256": "b5a698cf2133f709b0f1d6f86810af08e291144197132d6335e35a34745f97b2",
            "releaseNotes": "Adds Roku playback through the LocalWave Receiver app using Roku's supported DIAL launch path, while preserving Samsung/DLNA synchronization and TV startup isolation."
          }
          EOF
          rm -f .github/workflows/publish-v01310-once.yml
          rm -f .publish-v01310-trigger
          git add -A
          git commit -m 'advance LocalWave updater to v0.13.10'
          git push origin HEAD:release-feed
